# watchlist.yaml
poll_hours: 3
smoke_test_repo: hf-internal-testing/tiny-random-gpt2
targets:
  # Preservation anchor: keep FP8 weights; BF16 is excluded unconditionally.
  - author: moonshotai
    include: ["Kimi-K3"]
    priority: base
    file_rules:
      always_keep: ["*.json", "*.txt", "*.md", "*.model", "tokenizer*", "*.py"]
      include: []
      exclude: ["*bf16*", "*BF16*"]
    max_total_bytes: 4_000_000_000_000

  # Preservation anchor: the upstream base every abliterated Qwen3.8 repo is
  # derived from. priority "base" bypasses passes_gates on purpose - the gates
  # look for "abliterat"/"heretic" in the repo id, which an upstream base never
  # has. Empty include keeps every weight in each matching repo.
  #
  # _repo_matches is a substring test, so this necessarily matches BOTH
  # Qwen/Qwen3.8-27B (BF16 master, 55.6 GB) and Qwen/Qwen3.8-27B-FP8 (30.9 GB).
  # There is no repo-level exclude. Keeping both is deliberate: FP8 is the
  # higher-downloaded artifact and is what vLLM actually serves, matching the
  # FP8-over-BF16 preference already set for Kimi-K3 above.
  - author: Qwen
    include: ["Qwen3.8-27B"]
    priority: base
    file_rules:
      always_keep: ["*.json", "*.txt", "*.md", "*.jinja", "*.model", "tokenizer*", "*.py"]
      include: []
      exclude: []
    max_total_bytes: 80_000_000_000

